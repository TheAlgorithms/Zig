name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: zed-industries/setup-zig@node24
        with:
          version: 0.17.0

      - name: Testing
        run: zig run runall.zig

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zed-industries/setup-zig@node24
        with:
          version: 0.17.0
      - run: zig fmt --check --ast-check */*.zig
